; Device tiers for ULAANBAATAR 6 MOBILE. The runtime governor (UUB6QualitySubsystem) picks
; LOW / MEDIUM / HIGH from RAM, core count and r.UB6.GpuTier, then adapts while playing.
; The device lists below are starting points and MUST be verified on real hardware
; (docs/TESTING.md). Unknown devices fall back to the conservative base profiles.

[DeviceProfiles]
+DeviceProfileNameAndTypes=UB6_Android_Low,Android
+DeviceProfileNameAndTypes=UB6_Android_Mid,Android
+DeviceProfileNameAndTypes=UB6_Android_High,Android
+DeviceProfileNameAndTypes=UB6_IOS_Low,IOS
+DeviceProfileNameAndTypes=UB6_IOS_Mid,IOS
+DeviceProfileNameAndTypes=UB6_IOS_High,IOS

[Android DeviceProfile]
; Base Android: treat as mid tier with a conservative content scale.
+CVars=r.UB6.GpuTier=1
+CVars=r.MobileContentScaleFactor=1.0
+CVars=r.Mobile.AntiAliasing=1

[UB6_Android_Low DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.UB6.GpuTier=0
+CVars=r.MobileContentScaleFactor=0.8
+CVars=r.Mobile.AntiAliasing=0
+CVars=r.DefaultFeature.Bloom=0
+CVars=r.Streaming.PoolSize=200

[UB6_Android_Mid DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.UB6.GpuTier=1

[UB6_Android_High DeviceProfile]
DeviceType=Android
BaseProfileName=Android
+CVars=r.UB6.GpuTier=2
+CVars=r.MobileContentScaleFactor=1.25
+CVars=r.Streaming.PoolSize=800

[IOS DeviceProfile]
+CVars=r.UB6.GpuTier=1
+CVars=r.MobileContentScaleFactor=2.0

[UB6_IOS_Low DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=r.UB6.GpuTier=0
+CVars=r.MobileContentScaleFactor=1.5
+CVars=r.Streaming.PoolSize=200

[UB6_IOS_Mid DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=r.UB6.GpuTier=1

[UB6_IOS_High DeviceProfile]
DeviceType=IOS
BaseProfileName=IOS
+CVars=r.UB6.GpuTier=2
+CVars=r.MobileContentScaleFactor=2.5
+CVars=r.Streaming.PoolSize=800

; To map real devices onto these tiers, add [/Script/AndroidDeviceProfileSelector...] rules
; (GPU family / RAM) and iPhone model rules after testing. Left empty on purpose: unverified
; device lists would be guesses.
