; ULAANBAATAR 6 MOBILE - engine configuration.
; Written for Unreal Engine 5.5. NOT yet validated in an editor build: check each setting
; against your engine version when first opening the project (see docs/LOCAL_SETUP.md).

[/Script/EngineSettings.GameMapsSettings]
; No map assets are required: the game mode builds the world at runtime from pipeline data.
GameDefaultMap=/Engine/Maps/Entry.Entry
EditorStartupMap=/Engine/Maps/Entry.Entry
GlobalDefaultGameMode=/Script/Ulaanbaatar6.UB6GameMode

[/Script/Engine.Engine]
+ActiveGameNameRedirects=(OldGameName="TP_Blank",NewGameName="/Script/Ulaanbaatar6")

[/Script/Engine.RendererSettings]
; --- Mobile baseline: forward shading, no Lumen, no Nanite dependency ---
r.Mobile.ShadingPath=0
r.MobileHDR=True
r.Mobile.AntiAliasing=1
r.DynamicGlobalIlluminationMethod=0
r.ReflectionMethod=0
r.Shadow.Virtual.Enable=0
r.Nanite.ProjectEnabled=False
r.Mobile.AllowDitheredLODTransition=True
r.Mobile.EnableStaticAndCSMShadowReceivers=True
r.Mobile.EnableMovableLightCSMShaderCulling=True
r.Mobile.AllowDistanceFieldShadows=False
r.Mobile.SupportGPUScene=True
r.TextureStreaming=True
r.Streaming.PoolSize=400
r.DefaultFeature.AutoExposure=False
r.DefaultFeature.MotionBlur=False
r.DefaultFeature.Bloom=True
r.SkyAtmosphere=True
r.SupportSkyAtmosphere=True

[/Script/Engine.StreamingSettings]
s.AsyncLoadingThreadEnabled=True

[/Script/Engine.PhysicsSettings]
bEnableAsyncScene=False
MaxPhysicsDeltaTime=0.033333

[/Script/AndroidRuntimeSettings.AndroidRuntimeSettings]
PackageName=mn.ulaanbaatar6.game
StoreVersion=1
VersionDisplayName=0.1.0
MinSDKVersion=26
TargetSDKVersion=34
Orientation=SensorLandscape
bFullScreen=True
bSupportsVulkan=True
bBuildForES31=True
bBuildForArm64=True
bBuildForArmV7=False
bPackageDataInsideApk=False
bUseExternalFilesDir=True
bEnableBundle=True
bEnableUniversalAPK=False
; Internet is needed for the live clock/weather sync only.
+ExtraPermissions=android.permission.INTERNET
+ExtraPermissions=android.permission.ACCESS_NETWORK_STATE
; Signing: set KeyStore, KeyAlias and passwords locally. Never commit them.

[/Script/AndroidPlatformEditor.AndroidSDKSettings]
; Leave empty to use ANDROID_HOME / NDKROOT / JAVA_HOME from the build machine.
SDKAPILevel=latest
NDKAPILevel=android-26

[/Script/IOSRuntimeSettings.IOSRuntimeSettings]
BundleDisplayName=Ulaanbaatar 6
BundleName=Ulaanbaatar6
BundleIdentifier=mn.ulaanbaatar6.game
VersionInfo=0.1.0
MinimumiOSVersion=IOS_16
bSupportsPortraitOrientation=False
bSupportsUpsideDownOrientation=False
bSupportsLandscapeLeftOrientation=True
bSupportsLandscapeRightOrientation=True
bSupportsMetal=True
bSupportsMetalMRT=False
bSupportsIPad=True
bSupportsIPhone=True
bGeneratedSYMFile=True
bAutomaticSigning=True
; Signing: set IOSTeamID locally (Project Settings > iOS) or pass it to scripts/build_ios.sh.
; Apple Developer Program membership is required. Never commit certificates or profiles.

[/Script/Engine.UserInterfaceSettings]
ApplicationScale=1.0

[ConsoleVariables]
; Read by UUB6QualitySubsystem; overridden per device profile.
r.UB6.GpuTier=1

[/Script/Engine.GarbageCollectionSettings]
gc.MaxObjectsInGame=262144
