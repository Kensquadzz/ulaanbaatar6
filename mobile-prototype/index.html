<!doctype html>
<html lang="mn">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="UB6" />
  <meta name="theme-color" content="#0b1020" />
  <meta name="robots" content="noindex, nofollow" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="icon" href="./icon.svg" />
  <link rel="apple-touch-icon" href="./icon.svg" />
  <title>ULAANBAATAR 6 · Mobile Prototype</title>
</head>
<body>
  <canvas id="game"></canvas>
  <div id="touch"></div>

  <div id="hud" class="hidden">
    <div id="mapwrap"><canvas id="minimap"></canvas><div id="dest"></div></div>
    <div id="street"></div>
    <div id="topRight">
      <div id="info" class="card" role="button">
        <div class="row"><span id="clock">--:--</span><span id="timeBadge" class="badge live"></span><span id="wxIcon"></span><span id="wxTemp"></span><span id="wxBadge" class="badge"></span></div>
        <div id="infoMore">
          <div id="date"></div>
          <div><span id="wxText"></span> <span id="wxAge"></span></div>
          <div id="sunLine"></div>
        </div>
      </div>
      <button id="btnSettings" class="round" aria-label="Settings">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="3.2"/><path d="M12 2.5v3M12 18.5v3M2.5 12h3M18.5 12h3M5.3 5.3l2.1 2.1M16.6 16.6l2.1 2.1M5.3 18.7l2.1-2.1M16.6 7.4l2.1-2.1"/></svg>
      </button>
    </div>
    <div id="fps" class="hidden"></div>
    <div id="stick"><div id="knob"></div></div>
    <button id="btnRun" class="action" data-i18n="run"></button>
    <button id="btnJump" class="action big" data-i18n="jump"></button>
    <div id="toast" class="hidden"></div>
  </div>

  <div id="settings" class="overlay hidden">
    <div class="panel scroll">
      <div class="phead"><h2 data-i18n="settings"></h2><button id="btnClose" class="pill" data-i18n="close"></button></div>
      <section><h3 data-i18n="language"></h3><div class="seg" id="segLang"><button data-v="mn">Монгол</button><button data-v="en">English</button></div></section>
      <section><h3 data-i18n="quality"></h3><div class="seg" id="segQuality">
        <button data-v="auto" data-i18n="q_auto"></button><button data-v="low" data-i18n="q_low"></button>
        <button data-v="medium" data-i18n="q_medium"></button><button data-v="high" data-i18n="q_high"></button></div>
        <div id="qualityNote" class="dim small"></div></section>
      <section><h3 data-i18n="sensitivity"></h3><input id="sens" type="range" min="0.4" max="2.2" step="0.1" value="1" /></section>
      <section><label class="check"><input id="showFps" type="checkbox" /> <span data-i18n="showFps"></span></label></section>
      <section><h3 data-i18n="time"></h3><div class="seg" id="segTime"><button data-v="live" data-i18n="t_live"></button><button data-v="free" data-i18n="t_free"></button></div>
        <div id="freeTime" class="hidden"><input id="hour" type="range" min="0" max="24" step="0.25" value="12" /><span id="hourLabel"></span></div></section>
      <section><h3 data-i18n="weather"></h3><div class="seg wrap" id="segWeather">
        <button data-v="live" data-i18n="w_live"></button><button data-v="clear" data-i18n="w_clear"></button><button data-v="cloudy" data-i18n="w_cloudy"></button>
        <button data-v="snow" data-i18n="w_snow"></button><button data-v="rain" data-i18n="w_rain"></button><button data-v="fog" data-i18n="w_fog"></button></div></section>
      <section><h3 data-i18n="travel"></h3><div id="travelList" class="list"></div></section>
      <section><h3 data-i18n="about"></h3><p class="small" data-i18n="notice"></p><p class="small" data-i18n="aboutText"></p><p id="attribution" class="small dim"></p></section>
    </div>
  </div>

  <div id="loading" class="overlay">
    <div class="loadbox">
      <div class="logo">ULAANBAATAR <span>6</span></div>
      <div class="sub" data-i18n="subtitle"></div>
      <div class="bar"><div id="barFill"></div></div>
      <div id="loadText" class="dim" data-i18n="loading"></div>
      <button id="btnPlay" class="play" disabled data-i18n="play"></button>
      <p class="small notice" data-i18n="notice"></p>
      <p class="small dim" data-i18n="homescreen"></p>
    </div>
  </div>
  <div id="rotate"><div class="phone"></div><div data-i18n="rotate"></div></div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
